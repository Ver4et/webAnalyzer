<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/styles/style.css">
    <title>Web-Analyzer</title>
</head>
<body class="lite-style">
    <header>
        <img src="./assets/img/logo.svg" alt="logo" height="60px" width="100px" loading="lazy">
        <h1>Web-Analyzer</h1>
        <div class="block-controls">
            <button id="btn_instruction">Инструкция</button>
            <button id="btn_style">Стили</button>
        </div>
    </header>
    <main>
        <section class="cap-block">
            <label for="enter_url">Введите ссылку:</label>
            <input type="url" id="enter_url" placeholder="https://example.com" autocomplete="url" required>
            <button id="button" type="button">Анализировать</button>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </section>
        <section id="modal_main" >
            <div class="modal_ints" id="modal_instruction">
                <div class="modal-content">
                    <span class="close" id="close_ints">&times;</span>
                    <h2>Инструкция по эксплуатации:</h2>
                    <p>Для начала работы с данным веб-приложением необходимо в панель ввода ввести ссылку на сайт.</p>
                    <p><strong>Для выбора темы необходимо: </strong> <br>
                        Нажать на соответствующую кнопку "Стили", после чего появится интерактивное меню, где можно выбрать смену темы. <br>
                        
                    </p>
                </div>
            </div>
            <div class="modal-styles" id="m-styles">
                <div class="modal-content">
                    <span class="close" id="close_styles">&times;</span>
                    <div class="block-btn">
                        <button id="btn_theme_default">Default</button>
                        <button id="btn_theme_retro">Retro</button>
                        <button id="btn_theme_dark">Dark</button>
                    </div>
                </div>
            </div>
        </section>
        <section id="result">
            <div class="r-inform">
                <h2 id="titleOut"></h2>
            </div>
        </section>
    </main>
    <script src="assets/scripts/main.js" defer></script>
</body>
</html>
